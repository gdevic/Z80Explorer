3327,7435 ; INT_MASK_S ; dynamic node 1122 (int_mask_s), loaded from int_mask (1166) through the clk pass t7435 while clk=1 and held while clk=0; t3327 pulls int_take (114) low. Holds the mask of the last T-state's clk=1 half through the commit row, so int_ack clearing IFF1 in that row does not change int_take.
3182,7601 ; IFF_WR_REQ ; dynamic node 1269 (_iff_wr_req_s), loaded while clk=1 through t7601 from 1283 = NAND(t1, m1, pla97); t3182 holds iff_wr (207) low. Low from M1T1 clk 1 of the M1 after EI/DI, so iff_wr fires in that M1's T2 clk 0.
7012,7825 ; IFF_RESTORE_REQ ; dynamic node 1227 (_iff_restore_req_s), loaded while clk=1 through t7825 from 1224 = NAND(t2, m1, pla46); t7012 holds iff_restore (183) low. Low from M1T2 clk 1 of the M1 after RETN/RETI, so iff_restore fires in that M1's T3 clk 0.
