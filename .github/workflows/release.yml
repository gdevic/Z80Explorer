name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.10)'
        required: true
        default: 'v1.10'

jobs:
  build-windows:
    name: Build - Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qthttpserver qtwebsockets'
          cache: true

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake)
        shell: cmd
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: cmake --build build --config Release --parallel

      - name: Install (deploy Qt libs)
        shell: cmd
        run: cmake --install build --config Release --prefix ${{ github.workspace }}/dist-windows

      - name: Archive Windows build
        shell: cmd
        run: |
          cd ${{ github.workspace }}\dist-windows
          7z a ${{ github.workspace }}\Z80Explorer-windows-x64.zip .

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z80Explorer-windows-x64
          path: Z80Explorer-windows-x64.zip
          retention-days: 5

  build-macos:
    name: Build - macOS
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qthttpserver qtwebsockets'
          cache: true

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install (deploy Qt libs)
        run: cmake --install build --config Release --prefix ${{ github.workspace }}/dist-macos

      - name: Create DMG
        run: |
          APP=$(find ${{ github.workspace }}/dist-macos -name '*.app' | head -1)
          echo "Found app bundle: $APP"
          hdiutil create -volname Z80Explorer -srcfolder "$APP" \
            -ov -format UDZO Z80Explorer-macos.dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z80Explorer-macos
          path: Z80Explorer-macos.dmg
          retention-days: 5

  build-linux:
    name: Build - Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qthttpserver qtwebsockets'
          cache: true

      - name: Configure (CMake)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        # Cap parallelism: bare `--parallel` maps to `make -j` with no limit on Make generators,
        # which can OOM on the ~7 GB Ubuntu runner during AUTOMOC's mocs_compilation_Release.cpp.
        run: cmake --build build --config Release --parallel 2

      - name: Install (deploy Qt libs)
        run: cmake --install build --config Release --prefix ${{ github.workspace }}/dist-linux

      - name: Archive Linux build
        run: tar -czf Z80Explorer-linux-x64.tar.gz -C ${{ github.workspace }}/dist-linux .

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z80Explorer-linux-x64
          path: Z80Explorer-linux-x64.tar.gz
          retention-days: 5

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Z80Explorer-windows-x64
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: Z80Explorer-macos
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Z80Explorer-linux-x64
          path: artifacts/

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Z80Explorer ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/Z80Explorer-windows-x64.zip
            artifacts/Z80Explorer-macos.dmg
            artifacts/Z80Explorer-linux-x64.tar.gz
